            session = null;                                                                                                                                                                              
        }                                                                                                                                                                                                

        let currentCursorUrl = null;
        let streamFocused = false;
        let pointerLocked = false;
        let vMouseX = 0, vMouseY = 0;
        let curX = 0, curY = 0;
        let mouseButtons = 0;
        const activeKeys = new Set();
        let escHoldTimer = null;

        function getVideoRect() {
            const video = document.getElementById('cloudVideo');
            const rect = video.getBoundingClientRect();

            const vw = video.videoWidth || rect.width;
            const vh = video.videoHeight || rect.height;

            if (!vw || !vh) {
                return {
                    left: rect.left,
                    top: rect.top,
                    width: rect.width,
                    height: rect.height
                };
            }

            const scale = Math.min(rect.width / vw, rect.height / vh);
            const rw = vw * scale;
            const rh = vh * scale;

            return {
                left: rect.left + (rect.width - rw) / 2,
                top: rect.top + (rect.height - rh) / 2,
                width: rw,
                height: rh
            };
        }

        function dcSend(buf) {
            if (inputChannel && inputChannel.readyState === 'open') {
                try {
                    inputChannel.send(buf);
                } catch {}
            }
        }

        function setupCursorHandling(dc) {
            const MIMEMAP = {
                0: "image/x-icon",
                1: "image/jpeg",
                2: "image/png",
                3: "image/gif"
            };

            const video = document.getElementById('cloudVideo');

            dc.onmessage = (e) => {
                if (!(e.data instanceof ArrayBuffer)) return;

                const v = new DataView(e.data);

                if (v.byteLength > 4 && v.getUint8(0) === 163 && v.getUint8(1) === 6) {
                    if (v.byteLength <= 32) {
                        video.style.cursor = "none";

                        if (currentCursorUrl) {
                            URL.revokeObjectURL(currentCursorUrl);
                            currentCursorUrl = null;
                        }
                    } else {
                        const mimeType = MIMEMAP[v.getUint8(2)] || "image/png";
                        const hotX = v.getUint8(3);
                        const hotY = v.getUint8(4);

                        const blob = new Blob([e.data.slice(5)], {
                            type: mimeType
                        });

                        if (currentCursorUrl) {
                            URL.revokeObjectURL(currentCursorUrl);
                        }

                        currentCursorUrl = URL.createObjectURL(blob);
                        video.style.cursor = `url(${currentCursorUrl}) ${hotX} ${hotY}, default`;

                        if (document.pointerLockElement === video) {
                            try { document.exitPointerLock(); } catch {}
                        }
                    }
                }
            };
        }

        function sendMouse(moveX = 0, moveY = 0, scroll = 0) {
            if (!inputChannel || inputChannel.readyState !== 'open') return;

            moveX = Math.max(-127, Math.min(127, Math.round(moveX)));
            moveY = Math.max(-127, Math.min(127, Math.round(moveY)));
            scroll = Math.max(-127, Math.min(127, Math.round(scroll)));

            const r = getVideoRect();
            if (!r.width || !r.height) return;

            const absX = Math.floor(((curX - r.left) / r.width) * 10000);
            const absY = Math.floor(((curY - r.top) / r.height) * 10000);

            const buf = new ArrayBuffer(12);
            const v = new DataView(buf);

            v.setUint8(0, 1);
            v.setUint8(1, 11);
            v.setUint8(2, 2);
            v.setUint8(3, 8);

            v.setUint16(4, Math.max(0, Math.min(10000, absX)));
            v.setUint16(6, Math.max(0, Math.min(10000, absY)));

            v.setInt8(8, moveX);
            v.setInt8(9, moveY);
            v.setUint8(10, mouseButtons);
            v.setInt8(11, scroll);

            dcSend(buf);
        }

        function sendKey(keyCode, isDown) {
            if (!inputChannel || inputChannel.readyState !== 'open') return;

            const code = Number(keyCode);
            if (!code) return;

            if (isDown) activeKeys.add(code);
            else activeKeys.delete(code);

            const buf = new ArrayBuffer(24);
            const v = new DataView(buf);

            v.setUint8(0, 1);
            v.setUint8(2, 1);
            v.setUint8(3, 1);
            v.setUint16(4, code); // intentional: big-endian
            v.setUint8(6, isDown ? 1 : 0);

            let offset = 7;
            for (const k of activeKeys) {
                if (k !== code && k > 0 && k < 255 && offset < 21) {
                    v.setUint16(offset, k); // intentional: big-endian
                    offset += 2;
                    v.setUint8(offset, 1);
                    offset++;
                }
            }

            v.setUint8(offset++, 255);
            v.setUint8(1, offset - 1);
            dcSend(buf.slice(0, offset));
        }

        const GAMEPAD_BTN_MASK = [
            4096, 8192, 16384, 32768,
            256, 512, 0, 0,
            32, 16, 64, 128,
            1, 2, 4, 8, 0
        ];

        function sendGamepad() {
            if (!inputChannel || inputChannel.readyState !== 'open') return;

            const gamepads = navigator.getGamepads?.() || [];

            for (let i = 0; i < gamepads.length; i++) {
                const gp = gamepads[i];
                if (!gp) continue;

                let mask = 0;
                let lt = 0;
                let rt = 0;

                for (let b = 0; b < Math.min(gp.buttons.length, 17); b++) {
                    const btn = gp.buttons[b];
                    const pressed = typeof btn === "object" ? btn.pressed : btn > 0;
                    const value = typeof btn === "object" ? btn.value : btn;

                    if (pressed) {
                        if (b === 6) lt = Math.round(value * 255);
                        else if (b === 7) rt = Math.round(value * 255);
                        else mask |= GAMEPAD_BTN_MASK[b];
                    }
                }

                const ax = gp.axes;

                const lx = ax[0] ? Math.round(32767 * ax[0]) : 0;
                const ly = ax[1] ? Math.round(-32767 * ax[1]) : 0;
                const rx = ax[2] ? Math.round(32767 * ax[2]) : 0;
                const ry = ax[3] ? Math.round(-32767 * ax[3]) : 0;

                const buf = new ArrayBuffer(17);
                const v = new DataView(buf);

                v.setUint8(0, 1);
                v.setUint8(1, 16);
                v.setUint8(2, 3);
                v.setUint8(3, 2);
                v.setUint8(4, i);

                v.setUint16(5, mask, true);
                v.setUint8(7, lt);
                v.setUint8(8, rt);

                v.setInt16(9, lx, true);
                v.setInt16(11, ly, true);
                v.setInt16(13, rx, true);
                v.setInt16(15, ry, true);

                dcSend(buf);
            }
        }

        function inputLoop() {
            if (inputChannel && inputChannel.readyState === 'open') {
                sendGamepad();
            }

            requestAnimationFrame(inputLoop);
        }
        requestAnimationFrame(inputLoop);

        function installVmInput() {
            const video = document.getElementById('cloudVideo');

            video.addEventListener('mouseenter', () => {
                if (inputChannel && inputChannel.readyState === 'open') {
                    streamFocused = true;
                    video.focus({ preventScroll: true });
                }
            });

            video.addEventListener('mouseleave', () => {
                if (!pointerLocked) {
                    streamFocused = false;
                    navigator.keyboard?.unlock?.();
                }
            });

            document.addEventListener('pointerlockchange', () => {
                pointerLocked = document.pointerLockElement === video;

                if (pointerLocked) {
                    const r = getVideoRect();
                    vMouseX = Math.max(0, Math.min(r.width, curX - r.left));
                    vMouseY = Math.max(0, Math.min(r.height, curY - r.top));
                } else {
                    navigator.keyboard?.unlock?.();
                }
            });

            video.addEventListener('click', () => {
                if (!inputChannel || inputChannel.readyState !== 'open') return;

                streamFocused = true;
                video.focus({ preventScroll: true });

                navigator.keyboard?.lock?.().catch(() => {});
            });

            document.addEventListener('click', (e) => {
                if (streamFocused && !video.contains(e.target)) {
                    streamFocused = false;
                    navigator.keyboard?.unlock?.();
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (streamFocused && inputChannel?.readyState === 'open') {
                    const moveX = e.movementX || 0;
                    const moveY = e.movementY || 0;
                    const r = getVideoRect();

                    if (pointerLocked) {
                        vMouseX = Math.max(0, Math.min(r.width, vMouseX + moveX));
                        vMouseY = Math.max(0, Math.min(r.height, vMouseY + moveY));

                        curX = r.left + vMouseX;
                        curY = r.top + vMouseY;
                    } else {
                        curX = Math.max(r.left, Math.min(r.left + r.width, e.clientX));
                        curY = Math.max(r.top, Math.min(r.top + r.height, e.clientY));
                    }

                    sendMouse(moveX, moveY, 0);
                } else {
                    curX = e.clientX;
                    curY = e.clientY;
                }
            });

            document.addEventListener('mousedown', (e) => {
                if (!streamFocused || inputChannel?.readyState !== 'open') return;

                if (video.style.cursor === 'none' && !pointerLocked) {
                    video.requestPointerLock?.().catch(() => {});
                }

                mouseButtons = e.buttons;
                sendMouse(0, 0, 0);

                e.preventDefault();
            }, { capture: true });

            document.addEventListener('mouseup', (e) => {
                if (!streamFocused || inputChannel?.readyState !== 'open') return;

                mouseButtons = e.buttons;
                sendMouse(0, 0, 0);

                e.preventDefault();
            }, { capture: true });

            document.addEventListener('contextmenu', (e) => {
                if (streamFocused) e.preventDefault();
            });

            video.addEventListener('wheel', (e) => {
                if (!streamFocused || inputChannel?.readyState !== 'open') return;

                e.preventDefault();

                sendMouse(
                    0,
                    0,
                    e.deltaY > 0 ? -1 : 1
                );
            }, { passive: false });

            document.addEventListener('keydown', (e) => {
                if (!streamFocused || inputChannel?.readyState !== 'open') return;

                e.preventDefault();
                e.stopPropagation();

                const code = e.keyCode || e.which;
                if (!code) return;

                // Do not resend auto-repeat. The first keydown already tells
                // the VM that this key is held.
                if (e.repeat) return;

                if (code === 27 && !escHoldTimer) {
                    escHoldTimer = setTimeout(() => {
                        if (document.pointerLockElement) {
                            try { document.exitPointerLock(); } catch {}
                        }
                        streamFocused = false;
                        escHoldTimer = null;
                    }, 1200);
                }

                sendKey(code, true);
            }, { capture: true });

            document.addEventListener('keyup', (e) => {
                // Always release keys that this client believes are down,
                // even if focus was lost between keydown and keyup.
                const code = e.keyCode || e.which;
                const shouldRelease = activeKeys.has(code);
                if (!shouldRelease && !streamFocused) return;
                if (inputChannel?.readyState !== 'open') return;

                e.preventDefault();
                e.stopPropagation();

                if (code === 27) {
                    clearTimeout(escHoldTimer);
                    escHoldTimer = null;
                }

                sendKey(code, false);
            }, { capture: true });
        }

        window.addEventListener('blur', () => {
            if (!inputChannel || inputChannel.readyState !== 'open') return;

            for (const code of activeKeys) {
                sendKey(code, false);
            }

            activeKeys.clear();
            mouseButtons = 0;

            sendMouse(0, 0, 0);

            if (document.pointerLockElement) {
                try { document.exitPointerLock(); } catch {}
            }

            streamFocused = false;
            navigator.keyboard?.unlock?.();
        });

        installVmInput();
                                                                                                                                                                                
        fetchAndRenderGames();                                                                                                                                                                           
    </script>                                                                                                                                                                                           
</body>                                                                                                                                                                                                 
</html>
